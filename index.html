<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineFarm Hub</title>
    <!-- Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

    <style>
        :root {
            --bg-color: #2e7d32;
            --creeper-dark: #1b5e20;
            --creeper-black: #000000;
            --panel-bg: #4caf50;
            --panel-border: #1b5e20;
            --text-color: #ffffff;
            --accent-yellow: #ffeb3b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Press Start 2P', cursive;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            /* Minecraft Creeper Dokulu Arka Plan */
            background-image: 
                linear-gradient(45deg, var(--creeper-dark) 25%, transparent 25%), 
                linear-gradient(-45deg, var(--creeper-dark) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--creeper-dark) 75%),
                linear-gradient(-45deg, transparent 75%, var(--creeper-dark) 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1b5e20;
            border-bottom: 4px solid #000;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 0 #000;
        }

        h1 {
            font-size: 16px;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px #000;
            color: #a5d6a7;
        }

        /* Navigasyon / Sekmeler (AI Kaldırıldı) */
        nav {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            padding: 10px;
            background: rgba(0,0,0,0.4);
        }

        .tab-btn {
            background: #81c784;
            border: 3px solid #000;
            color: #000;
            padding: 8px 10px;
            font-size: 9px;
            cursor: pointer;
            box-shadow: inset -2px -2px 0px #388e3c;
        }

        .tab-btn.active {
            background: var(--accent-yellow);
            box-shadow: inset -2px -2px 0px #fbc02d;
        }

        /* Ana İçerik Konteyneri */
        main {
            flex: 1;
            padding: 20px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .section {
            display: none;
            background: rgba(0, 0, 0, 0.75);
            border: 4px solid #fff;
            padding: 20px;
            box-shadow: 6px 6px 0px #000;
        }

        .section.active {
            display: block;
        }

        /* Kullanıcı Kimliği Girişi */
        .user-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            background: #2e7d32;
            padding: 8px;
            border: 2px solid #000;
        }

        input[type="text"], input[type="url"], textarea {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 2px solid #81c784;
            color: #fff;
            font-size: 10px;
            margin-bottom: 10px;
            outline: none;
        }

        button.btn-main {
            background: #4caf50;
            border: 3px solid #000;
            color: #fff;
            padding: 10px 15px;
            font-size: 10px;
            cursor: pointer;
            text-shadow: 1px 1px #000;
            box-shadow: inset -2px -2px 0 #1b5e20;
        }

        button.btn-main:hover {
            background: #66bb6a;
        }

        /* Kart Listeleri */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .card {
            background: #1b5e20;
            border: 3px solid #fff;
            padding: 15px;
            position: relative;
        }

        .card-title {
            color: var(--accent-yellow);
            font-size: 11px;
            margin-bottom: 8px;
        }

        .card-author {
            font-size: 8px;
            color: #a5d6a7;
            margin-top: 8px;
        }

        .card-img {
            max-width: 100%;
            height: auto;
            border: 2px solid #000;
            margin-top: 8px;
            display: block;
        }

        /* Farmlar Özel - 16x16 Tuval ve 36 Renk Paleti */
        #canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
            background: #333;
            padding: 10px;
            border: 2px solid #fff;
        }

        #pixel-canvas {
            display: grid;
            grid-template-columns: repeat(16, 15px);
            grid-template-rows: repeat(16, 15px);
            gap: 1px;
            background: #555;
            cursor: crosshair;
        }

        .pixel {
            width: 15px;
            height: 15px;
            background: #ffffff;
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(12, 20px);
            gap: 3px;
            margin-top: 12px;
            background: #222;
            padding: 6px;
            border: 2px solid #555;
        }

        .color-box {
            width: 20px;
            height: 20px;
            border: 1px solid #000;
            cursor: pointer;
        }

        .color-box:hover {
            transform: scale(1.1);
            border-color: #fff;
        }

        /* Komut Blokları */
        .code-block {
            background: #000;
            color: #64ffda;
            padding: 8px;
            font-family: monospace;
            font-size: 10px;
            border-left: 3px solid var(--accent-yellow);
            margin: 5px 0;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <header>
        <h1>MINEFARM HUB</h1>
        <div class="user-bar">
            <span style="font-size: 8px;">KULLANICI:</span>
            <input type="text" id="username-input" value="Steve" placeholder="Kullanıcı Adınız" style="margin:0; width: 180px;">
        </div>
        <nav>
            <button class="tab-btn active" onclick="switchTab('farmlar')">FARMLAR</button>
            <button class="tab-btn" onclick="switchTab('kodlar')">KODLAR</button>
            <button class="tab-btn" onclick="switchTab('haritalar')">HARİTALAR</button>
            <button class="tab-btn" onclick="switchTab('modlar')">MODLAR</button>
            <button class="tab-btn" onclick="switchTab('seedler')">SEEDLER</button>
        </nav>
    </header>

    <main>
        <!-- FARMLAR BÖLÜMÜ -->
        <section id="sec-farmlar" class="section active">
            <h2>FARM KATALOGLARI</h2>
            <div id="admin-farm-panel" style="display:none; margin-bottom: 15px; border: 2px dashed var(--accent-yellow); padding: 10px;">
                <h3 style="color:var(--accent-yellow); font-size:10px;">YÖNETİCİ: YENİ FARM KATEGORİSİ EKLENİYOR</h3>
                <input type="text" id="farm-cat-title" placeholder="Farm Başlığı">
                <textarea id="farm-cat-desc" placeholder="Farm Açıklaması"></textarea>
                
                <p style="font-size: 8px;">16x16 KATALOG KAPAĞI ÇİZİN (36 RENK PALETİ):</p>
                <div id="canvas-container">
                    <div id="pixel-canvas"></div>
                    <div class="color-palette" id="color-palette-box"></div>
                </div>
                <button class="btn-main" onclick="saveFarmCategory()">KATEGORİYİ YÜKLE</button>
            </div>

            <div id="farm-categories-list" class="card-list"></div>

            <!-- Seçili Farmın Gönderileri -->
            <div id="farm-posts-container" style="display:none; margin-top: 20px; border-top: 3px solid #fff; padding-top: 10px;">
                <button class="btn-main" onclick="closeFarmPosts()" style="background:#d32f2f; margin-bottom:10px;">← GERİ DÖN</button>
                <h3 id="current-farm-title" style="color: var(--accent-yellow); margin-bottom: 10px;"></h3>
                <button class="btn-main" onclick="toggleFarmPostForm()" style="margin-bottom: 10px;">BU FARMLA İLGİLİ GÖNDERİ PAYLAŞ</button>
                
                <div id="farm-post-form" style="display:none; background:#000; padding:10px; margin-bottom:15px; border:2px solid #81c784;">
                    <input type="text" id="post-version" placeholder="Sürüm (örn: 1.20.1)">
                    <textarea id="post-desc" placeholder="Gönderi Açıklaması"></textarea>
                    <p style="font-size: 8px;">GÖRSEL YÜKLE (Opsiyonel):</p>
                    <input type="file" id="post-file" accept="image/*" style="margin-bottom: 10px;">
                    <input type="url" id="post-yt-url" placeholder="Veya YouTube Video Bağlantısı Linki">
                    <button class="btn-main" onclick="submitFarmPost()">GÖNDERİYİ PAYLAŞ</button>
                </div>

                <div id="farm-posts-list" class="card-list"></div>
            </div>
        </section>

        <!-- KODLAR BÖLÜMÜ -->
        <section id="sec-kodlar" class="section">
            <h2>KODLAR & KOMUTLAR</h2>
            <input type="text" id="code-search-input" placeholder="🔍 Kapsamlı Kod Ara..." oninput="filterCodes()">
            
            <div style="background: rgba(0,0,0,0.5); padding: 10px; margin-bottom: 15px; border:2px solid #1b5e20;">
                <h3 style="font-size: 10px; margin-bottom: 8px;">YENİ KOD EKLE</h3>
                <input type="text" id="code-title" placeholder="Kod Başlığı">
                <input type="text" id="code-command" placeholder="Komut (Zorunlu '/' ile başlamalı)">
                <textarea id="code-desc" placeholder="Açıklama"></textarea>
                <button class="btn-main" onclick="submitCode()">KODU YAYINLA</button>
            </div>

            <div id="codes-list" class="card-list"></div>
        </section>

        <!-- HARİTALAR BÖLÜMÜ -->
        <section id="sec-haritalar" class="section">
            <h2>HARİTA PAYLAŞIMI</h2>
            <div style="background: rgba(0,0,0,0.5); padding: 10px; margin-bottom: 15px; border:2px solid #1b5e20;">
                <input type="text" id="map-title" placeholder="Harita Başlığı">
                <input type="url" id="map-url" placeholder="İndirme Web Sitesi Adresi (URL)">
                <input type="text" id="map-version" placeholder="Sürüm">
                <p style="font-size:8px;">KAPAK RESMİ SEÇ:</p>
                <input type="file" id="map-file" accept="image/*">
                <button class="btn-main" onclick="submitMap()" style="margin-top:10px;">HARİTAYI PAYLAŞ</button>
            </div>
            <div id="maps-list" class="card-list"></div>
        </section>

        <!-- MODLAR BÖLÜMÜ -->
        <section id="sec-modlar" class="section">
            <h2>MOD PAYLAŞIMI</h2>
            <div style="background: rgba(0,0,0,0.5); padding: 10px; margin-bottom: 15px; border:2px solid #1b5e20;">
                <input type="text" id="mod-title" placeholder="Mod Başlığı">
                <input type="url" id="mod-url" placeholder="İndirme Web Sitesi Adresi (URL)">
                <input type="text" id="mod-version" placeholder="Sürüm">
                <p style="font-size:8px;">KAPAK RESMİ SEÇ:</p>
                <input type="file" id="mod-file" accept="image/*">
                <button class="btn-main" onclick="submitMod()" style="margin-top:10px;">MODU PAYLAŞ</button>
            </div>
            <div id="mods-list" class="card-list"></div>
        </section>

        <!-- SEEDLER BÖLÜMÜ -->
        <section id="sec-seedler" class="section">
            <h2>WORLD SEEDLERİ</h2>
            <div style="background: rgba(0,0,0,0.5); padding: 10px; margin-bottom: 15px; border:2px solid #1b5e20;">
                <input type="text" id="seed-title" placeholder="Başlık">
                <input type="text" id="seed-version" placeholder="Sürüm">
                <input type="text" id="seed-code" placeholder="Seed Kodu (örn: -455211845)">
                <p style="font-size:8px;">GÖRSEL SEÇ:</p>
                <input type="file" id="seed-file" accept="image/*">
                <button class="btn-main" onclick="submitSeed()" style="margin-top:10px;">SEED'İ PAYLAŞ</button>
            </div>
            <div id="seeds-list" class="card-list"></div>
        </section>
    </main>

    <script>
        // ----------------------------------------------------
        // FIREBASE YAPILANDIRMASI
        // ----------------------------------------------------
        const firebaseConfig = { 
            apiKey: "AIzaSyBqC43kSzGNgK00ORcmDHhDYkUVjhwCjmU", 
            authDomain: "minefarm-a5199.firebaseapp.com", 
            databaseURL: "https://minefarm-a5199-default-rtdb.firebaseio.com", 
            projectId: "minefarm-a5199", 
            storageBucket: "minefarm-a5199.firebasestorage.app", 
            messagingSenderId: "81140698124", 
            appId: "1:81140698124:web:828602f12638ae6fd8b229", 
            measurementId: "G-26X2V8L7WZ" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ----------------------------------------------------
        // UYGULAMA DEĞİŞKENLERİ VE 36 RENK PALETİ
        // ----------------------------------------------------
        let currentUser = "Steve";
        let activeFarmCategoryId = null;
        let currentColor = "#000000";

        // Tam 36 Renk Paleti
        const paletteColors = [
            "#000000", "#1d1d21", "#3a3a3d", "#7f7f7f", "#b4b4b4", "#ffffff",
            "#5b1919", "#8b0000", "#ff0000", "#ff7f7f", "#ffb3b3", "#ffcccc",
            "#b84400", "#e65c00", "#ffa500", "#ffcc00", "#ffff00", "#ffff7f",
            "#003300", "#006600", "#00aa00", "#55ff55", "#a3ffa3", "#d2ffd2",
            "#003333", "#006666", "#00ffff", "#7fff7f", "#7fffd4", "#e0ffff",
            "#000066", "#0000aa", "#0000ff", "#7f7fff", "#b8b8ff", "#e8e8ff"
        ];

        const paletteContainer = document.getElementById('color-palette-box');
        paletteColors.forEach(hex => {
            const box = document.createElement('div');
            box.className = 'color-box';
            box.style.backgroundColor = hex;
            box.title = hex;
            box.addEventListener('click', () => {
                currentColor = hex;
            });
            paletteContainer.appendChild(box);
        });

        document.getElementById('username-input').addEventListener('input', (e) => {
            currentUser = e.target.value.trim() || "Anonim";
            checkAdminStatus();
        });

        function checkAdminStatus() {
            const adminPanel = document.getElementById('admin-farm-panel');
            if (currentUser.startsWith("MinEFarm:")) {
                adminPanel.style.display = "block";
            } else {
                adminPanel.style.display = "none";
            }
        }

        // 16x16 Piksel Çizim Tuvali
        const pixelCanvas = document.getElementById('pixel-canvas');
        for (let i = 0; i < 256; i++) {
            const pixel = document.createElement('div');
            pixel.className = 'pixel';
            pixel.addEventListener('click', () => {
                pixel.style.backgroundColor = currentColor;
            });
            pixelCanvas.appendChild(pixel);
        }

        function getCanvasDataURL() {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const pixels = pixelCanvas.children;
            
            for (let i = 0; i < 256; i++) {
                const row = Math.floor(i / 16);
                const col = i % 16;
                ctx.fillStyle = pixels[i].style.backgroundColor || '#ffffff';
                ctx.fillRect(col, row, 1, 1);
            }
            return canvas.toDataURL();
        }

        // ImgBB Otomatik Görsel Yükleyici
        async function uploadImageFile(fileInput) {
            const file = fileInput.files[0];
            if (!file) return "";
            const formData = new FormData();
            formData.append('image', file);
            
            try {
                const res = await fetch('https://api.imgbb.com/1/upload?key=6d700732615458a2e9ae70068593416b', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                return data.data ? data.data.url : "";
            } catch (err) {
                console.error("Resim yükleme hatası:", err);
                return "";
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`sec-${tabName}`).classList.add('active');
            event.target.classList.add('active');
        }

        // ----------------------------------------------------
        // FARMLAR BÖLÜMÜ
        // ----------------------------------------------------
        function saveFarmCategory() {
            const title = document.getElementById('farm-cat-title').value;
            const desc = document.getElementById('farm-cat-desc').value;
            const iconUrl = getCanvasDataURL();

            if(!title) return alert("Farm başlığı zorunludur!");

            db.ref('farmCategories').push({
                title: title,
                desc: desc,
                icon: iconUrl,
                author: currentUser
            });

            document.getElementById('farm-cat-title').value = "";
            document.getElementById('farm-cat-desc').value = "";
            alert("Farm Kategorisi Başarıyla Eklendi!");
        }

        db.ref('farmCategories').on('value', snapshot => {
            const list = document.getElementById('farm-categories-list');
            list.innerHTML = "";
            snapshot.forEach(child => {
                const item = child.val();
                const id = child.key;
                list.innerHTML += `
                    <div class="card" onclick="openFarmPosts('${id}', '${item.title}')" style="cursor:pointer;">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <img src="${item.icon}" style="width:48px; height:48px; image-rendering:pixelated; border:2px solid #000;">
                            <div>
                                <div class="card-title">${item.title}</div>
                                <div style="font-size:8px; color:#ddd;">${item.desc}</div>
                                <div class="card-author">Ekleyen: ${item.author}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        });

        function openFarmPosts(catId, catTitle) {
            activeFarmCategoryId = catId;
            document.getElementById('farm-categories-list').style.display = 'none';
            document.getElementById('farm-posts-container').style.display = 'block';
            document.getElementById('current-farm-title').innerText = catTitle;
            loadFarmPosts(catId);
        }

        function closeFarmPosts() {
            document.getElementById('farm-categories-list').style.display = 'flex';
            document.getElementById('farm-posts-container').style.display = 'none';
        }

        function toggleFarmPostForm() {
            const form = document.getElementById('farm-post-form');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        async function submitFarmPost() {
            const version = document.getElementById('post-version').value;
            const desc = document.getElementById('post-desc').value;
            const fileInput = document.getElementById('post-file');
            const ytUrl = document.getElementById('post-yt-url').value;

            const imgUrl = await uploadImageFile(fileInput);

            db.ref(`farmPosts/${activeFarmCategoryId}`).push({
                version: version,
                desc: desc,
                imageUrl: imgUrl,
                ytUrl: ytUrl,
                author: currentUser
            });

            document.getElementById('post-version').value = "";
            document.getElementById('post-desc').value = "";
            document.getElementById('post-yt-url').value = "";
            document.getElementById('farm-post-form').style.display = 'none';
        }

        function loadFarmPosts(catId) {
            db.ref(`farmPosts/${catId}`).on('value', snapshot => {
                const list = document.getElementById('farm-posts-list');
                list.innerHTML = "";
                snapshot.forEach(child => {
                    const item = child.val();
                    let mediaHtml = "";
                    if (item.imageUrl) mediaHtml += `<img src="${item.imageUrl}" class="card-img">`;
                    if (item.ytUrl) {
                        const ytId = item.ytUrl.split('v=')[1] || item.ytUrl.split('/').pop();
                        mediaHtml += `<iframe style="width:100%; height:200px; margin-top:8px; border:none;" src="https://www.youtube.com/embed/${ytId}"></iframe>`;
                    }

                    list.innerHTML += `
                        <div class="card">
                            <div style="font-size:10px; color:var(--accent-yellow);">Sürüm: ${item.version}</div>
                            <div style="font-size:9px; margin-top:5px; line-height:1.4;">${item.desc}</div>
                            ${mediaHtml}
                            <div class="card-author">Paylaşan: ${item.author}</div>
                        </div>
                    `;
                });
            });
        }

        // ----------------------------------------------------
        // KODLAR BÖLÜMÜ
        // ----------------------------------------------------
        function submitCode() {
            const title = document.getElementById('code-title').value;
            const command = document.getElementById('code-command').value;
            const desc = document.getElementById('code-desc').value;

            if (!command.startsWith('/')) {
                return alert("Komut mutlaka '/' işareti ile başlamalıdır!");
            }

            db.ref('codes').push({
                title: title,
                command: command,
                desc: desc,
                author: currentUser
            });

            document.getElementById('code-title').value = "";
            document.getElementById('code-command').value = "";
            document.getElementById('code-desc').value = "";
        }

        let allCodes = [];
        db.ref('codes').on('value', snapshot => {
            allCodes = [];
            snapshot.forEach(child => {
                allCodes.push(child.val());
            });
            renderCodes(allCodes);
        });

        function renderCodes(codes) {
            const list = document.getElementById('codes-list');
            list.innerHTML = "";
            codes.forEach(item => {
                list.innerHTML += `
                    <div class="card">
                        <div class="card-title">${item.title}</div>
                        <div class="code-block">${item.command}</div>
                        <div style="font-size:8px; margin-top:5px;">${item.desc}</div>
                        <div class="card-author">Paylaşan: ${item.author}</div>
                    </div>
                `;
            });
        }

        function filterCodes() {
            const query = document.getElementById('code-search-input').value.toLowerCase();
            const filtered = allCodes.filter(c => 
                c.title.toLowerCase().includes(query) || 
                c.command.toLowerCase().includes(query) || 
                c.desc.toLowerCase().includes(query)
            );
            renderCodes(filtered);
        }

        // ----------------------------------------------------
        // HARİTALAR BÖLÜMÜ
        // ----------------------------------------------------
        async function submitMap() {
            const title = document.getElementById('map-title').value;
            const url = document.getElementById('map-url').value;
            const version = document.getElementById('map-version').value;
            const fileInput = document.getElementById('map-file');

            const imgUrl = await uploadImageFile(fileInput);

            db.ref('maps').push({
                title: title,
                siteUrl: url,
                version: version,
                imageUrl: imgUrl,
                author: currentUser
            });
            alert("Harita paylaşıldı!");
        }

        db.ref('maps').on('value', snapshot => {
            const list = document.getElementById('maps-list');
            list.innerHTML = "";
            snapshot.forEach(child => {
                const item = child.val();
                list.innerHTML += `
                    <div class="card">
                        <div class="card-title">${item.title} [${item.version}]</div>
                        <a href="${item.siteUrl}" target="_blank" style="color:#81c784; font-size:8px;">Haritayı İndir / Bağlantıya Git</a>
                        ${item.imageUrl ? `<img src="${item.imageUrl}" class="card-img">` : ''}
                        <div class="card-author">Paylaşan: ${item.author}</div>
                    </div>
                `;
            });
        });

        // ----------------------------------------------------
        // MODLAR BÖLÜMÜ
        // ----------------------------------------------------
        async function submitMod() {
            const title = document.getElementById('mod-title').value;
            const url = document.getElementById('mod-url').value;
            const version = document.getElementById('mod-version').value;
            const fileInput = document.getElementById('mod-file');

            const imgUrl = await uploadImageFile(fileInput);

            db.ref('mods').push({
                title: title,
                siteUrl: url,
                version: version,
                imageUrl: imgUrl,
                author: currentUser
            });
            alert("Mod paylaşıldı!");
        }

        db.ref('mods').on('value', snapshot => {
            const list = document.getElementById('mods-list');
            list.innerHTML = "";
            snapshot.forEach(child => {
                const item = child.val();
                list.innerHTML += `
                    <div class="card">
                        <div class="card-title">${item.title} [${item.version}]</div>
                        <a href="${item.siteUrl}" target="_blank" style="color:#81c784; font-size:8px;">Modu İndir / Bağlantıya Git</a>
                        ${item.imageUrl ? `<img src="${item.imageUrl}" class="card-img">` : ''}
                        <div class="card-author">Paylaşan: ${item.author}</div>
                    </div>
                `;
            });
        });

        // ----------------------------------------------------
        // SEEDLER BÖLÜMÜ
        // ----------------------------------------------------
        async function submitSeed() {
            const title = document.getElementById('seed-title').value;
            const version = document.getElementById('seed-version').value;
            const seedCode = document.getElementById('seed-code').value;
            const fileInput = document.getElementById('seed-file');

            const imgUrl = await uploadImageFile(fileInput);

            db.ref('seeds').push({
                title: title,
                version: version,
                seedCode: seedCode,
                imageUrl: imgUrl,
                author: currentUser
            });
            alert("Seed paylaşıldı!");
        }

        db.ref('seeds').on('value', snapshot => {
            const list = document.getElementById('seeds-list');
            list.innerHTML = "";
            snapshot.forEach(child => {
                const item = child.val();
                list.innerHTML += `
                    <div class="card">
                        <div class="card-title">${item.title}</div>
                        <div style="font-size:9px; color:var(--accent-yellow); margin-top:4px;">SEED: ${item.seedCode} (Sürüm: ${item.version})</div>
                        ${item.imageUrl ? `<img src="${item.imageUrl}" class="card-img">` : ''}
                        <div class="card-author">Paylaşan: ${item.author}</div>
                    </div>
                `;
            });
        });

        checkAdminStatus();
    </script>
</body>
</html>
